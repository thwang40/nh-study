<script>
/* 在 hash 路由啟動前，先把 Google OAuth 回傳的 id_token 收進 sessionStorage */
(function(){
  try {
    var h = (location.hash || '').replace(/^#/, '');
    var q = (location.search || '').replace(/^\?/, '');
    var look = function(s){ return /(?:^|&)(id_token|error)=/.test(s); };
    var src = look(h) ? h : (look(q) ? q : '');
    if (src) {
      sessionStorage.setItem('nhSync.oauthReturn', src);
      history.replaceState(null, '', location.pathname + '#/');
    }
  } catch (e) {}
})();
</script>
